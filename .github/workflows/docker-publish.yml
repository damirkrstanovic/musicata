name: docker-publish

# Build + push the container images (server + optional audio-ML) to GHCR. A `v*` tag publishes
# semver-tagged images plus `latest` — the same tag that cuts the binary release (release.yml).
# A manual run (workflow_dispatch) publishes an `edge` image from the chosen ref for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The slim server (bookworm, glibc 2.36 — runs on low-end NAS CPUs).
          - image: server
            dockerfile: Dockerfile
          # The optional audio-ML service (trixie; ONNX Runtime needs glibc >= 2.38).
          - image: ml
            dockerfile: Dockerfile.ml
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # ghcr.io/<owner>/musicata-server and -ml. `latest` (default flavor) tracks the newest
          # semver tag; pin a release with its X.Y.Z / X.Y tag.
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # build.rs stamps this into the binary, so `--version` and the in-app AGPL section 13
          # source offer name the commit. `.dockerignore` excludes `.git`, so it can't be
          # derived inside the build.
          build-args: |
            MUSICATA_GIT_SHA=${{ github.sha }}
          # Layer cache across runs (the cargo cache mounts inside the build RUN don't persist in
          # CI, so a source change recompiles from scratch — acceptable for a release workflow).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
