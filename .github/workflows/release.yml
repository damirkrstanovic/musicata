name: release

# Build static musl binaries for the tagged release. Triggered by pushing a `v*`
# tag; `workflow_dispatch` lets us (re)attach binaries to an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to (e.g. v0.9)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable x86-64 (SSE4.2) — runs on any realistic NAS, including the
          # Celeron J4025 (Gemini Lake, no AVX2). The default x86 download.
          - name: musicata-x86_64-linux
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64-v2"
          # High-end x86-64 (v3: AVX2 + FMA) — faster fingerprinting on modern CPUs.
          # SIGILLs on pre-2015 / low-power chips (incl. Celeron NAS) — do not use there.
          - name: musicata-x86_64-v3-linux
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64-v3"
          - name: musicata-aarch64-linux
            target: aarch64-unknown-linux-musl
            rustflags: ""
    env:
      # Overrides .cargo/config.toml's [build] rustflags for this build.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5

      # Build the embedded web app once (it's arch-independent); the Rust build
      # then reuses web/dist via MUSICATA_SKIP_WEB_BUILD.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build web assets
        working-directory: crates/musicata-server/web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        env:
          MUSICATA_SKIP_WEB_BUILD: "1"
          # sqlite-vec.c uses the BSD-legacy types u_int8_t/16/32/64_t. glibc defines them, but
          # musl doesn't — so alias them to the C99 names for the (musl) cross-build. cc-rs appends
          # CFLAGS/TARGET_CFLAGS to the zig cc invocation for every C dep in the build.
          CFLAGS: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
          TARGET_CFLAGS: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
        run: cargo zigbuild --release -p musicata-server --target ${{ matrix.target }}

      - name: Package
        run: |
          dist="${{ matrix.name }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/musicata-server" "$dist/"
          cp packaging/musicata.service README.md "$dist/"
          tar -czf "$dist.tar.gz" "$dist"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.name }}.tar.gz
