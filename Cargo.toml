[workspace]
members = [
    "crates/musicata-core",
    "crates/musicata-server",
    "crates/musicata-storage",
]
resolver = "2"

# Release builds get cross-crate inlining + maximal vectorization. The fingerprint
# path (symphonia decode + chromaprint FFT) is the main beneficiary.
# target-cpu (SIMD width) is set in .cargo/config.toml.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/musicata/musicata"

[workspace.dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["ws"] }
md-5 = "0.10.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }
