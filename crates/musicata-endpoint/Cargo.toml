[package]
name = "musicata-endpoint"
version = "1.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A native Musicata playback endpoint: registers with a server and plays its queue (M10 prototype)."

[[bin]]
name = "musicata-endpoint"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Reused from the workspace: registration + audio-stream fetch (with the endpoint's Bearer token).
ureq.workspace = true
# Blocking WebSocket client for the player control channel. ws:// only (LAN); behind a TLS
# reverse proxy for wss. MIT/Apache-2.0.
tungstenite = "0.24"
# Audio output + decode (cpal → ALSA/CoreAudio/WASAPI). Symphonia decoders for the formats the
# library serves. MIT/Apache-2.0. This is why the crate is excluded from the default build.
rodio = { version = "0.20", features = ["symphonia-all"] }
