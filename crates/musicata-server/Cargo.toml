[package]
name = "musicata-server"
version = "1.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# SMB, OpenSubsonic, and Snapcast are on by default so a plain build can read network
# shares, consume an upstream Subsonic/Navidrome/Funkwhale server, and do synchronized
# multi-room playout; build with `--no-default-features` for a minimal binary without the
# `smb` dependency, the OpenSubsonic client, or the Snapcast decode path (the last also
# needs the `snapserver`/`snapclient` binaries installed at runtime).
default = ["provider-smb", "provider-opensubsonic", "provider-podcast", "provider-archive", "snapcast"]
# Read music from an SMB/CIFS network share directly (pure Rust, no mount). Pulls
# in the `smb` crate; see crate::smb.
provider-smb = ["dep:smb", "dep:futures"]
# Consume a remote OpenSubsonic/Navidrome/Funkwhale server as a music source (pure ureq +
# serde; no extra deps — the feature gates code only). See crate::opensubsonic.
provider-opensubsonic = []
# Subscribe to a podcast RSS feed as a browse-only (STREAM_ONLY) source: episodes are
# streams, never scanned into the library. Pulls in `quick-xml` for feed parsing. See
# crate::podcast.
provider-podcast = ["dep:quick-xml"]
# Play an Internet Archive item's audio files as a browse-only (STREAM_ONLY) source. No
# API key (public JSON metadata + download endpoints); no extra deps. See crate::archive_org.
provider-archive = []
# Generate TypeScript types for the web client from the server's response structs (the
# admin DTOs). Off by default; see scripts/gen-web-types.sh.
ts = ["dep:ts-rs", "musicata-core/ts"]
# Synchronized multi-room playback via Snapcast: decode the zone/player queue to PCM
# server-side and feed a managed `snapserver` over a FIFO, controlled by JSON-RPC.
# Requires the `snapserver`/`snapclient` binaries installed; see crate::snapcast.
snapcast = ["dep:rubato"]

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum.workspace = true
getrandom = "0.2"
md-5.workspace = true
musicata-core = { path = "../musicata-core" }
musicata-storage = { path = "../musicata-storage" }
notify = "6.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
smb = { version = "0.11.2", optional = true }
futures = { version = "0.3", optional = true }
rusty-chromaprint = "0.3.0"
base64 = "0.22.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "flac", "pcm", "wav"] }
# EBU R128 loudness analysis (volume leveling). Pure-Rust port of libebur128, MIT-licensed.
ebur128 = "0.1"
# Cover-art thumbnail resizing (`?size=`). Minimal codec set — only the formats we
# decode for covers — to keep the build lean. MIT/Apache-2.0 (AGPL-compatible).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Embeds the Vite-built web app (`web/dist/`, produced by build.rs) into the binary.
# `mime-guess` gives each asset its content type. MIT (AGPL-compatible).
rust-embed = { version = "8", features = ["mime-guess"] }
# Only pulled in under the `ts` feature (type generation); MIT/Apache-2.0.
ts-rs = { version = "10", optional = true }
# Sample-rate conversion for the Snapcast decode path (the library is mixed
# 44.1/48/96 kHz; snapserver runs at one fixed rate). Pulled in under `snapcast`;
# MIT (AGPL-compatible).
rubato = { version = "3", optional = true }
# Local-time scheduling for the ML worker (`localtime_r`, no datetime dep) and, under the
# `snapcast` feature, PR_SET_PDEATHSIG so a managed snapserver dies with us even on SIGKILL.
# MIT/Apache-2.0 (AGPL-compatible).
libc = "0.2"
# Library export/import archive (DB snapshot + artwork). Deflate only; MIT (AGPL-compatible).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Podcast RSS feed parsing (the `provider-podcast` feature). serde-based deserialization
# of the small RSS subset we need. MIT (AGPL-compatible).
quick-xml = { version = "0.37", features = ["serialize"], optional = true }

[dev-dependencies]
tower.workspace = true
