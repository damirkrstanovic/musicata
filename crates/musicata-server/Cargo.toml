[package]
name = "musicata-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# SMB is on by default so a plain build can read network shares; build with
# `--no-default-features` for a minimal binary without the `smb` dependency.
default = ["provider-smb"]
# Read music from an SMB/CIFS network share directly (pure Rust, no mount). Pulls
# in the `smb` crate; see crate::smb.
provider-smb = ["dep:smb", "dep:futures"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
md-5.workspace = true
musicata-core = { path = "../musicata-core" }
musicata-storage = { path = "../musicata-storage" }
notify = "6.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
smb = { version = "0.11.2", optional = true }
futures = { version = "0.3", optional = true }
rusty-chromaprint = "0.3.0"
base64 = "0.22.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "flac", "pcm", "wav"] }
# Cover-art thumbnail resizing (`?size=`). Minimal codec set — only the formats we
# decode for covers — to keep the build lean. MIT/Apache-2.0 (AGPL-compatible).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tower.workspace = true
