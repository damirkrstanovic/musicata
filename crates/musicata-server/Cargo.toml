[package]
name = "musicata-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Read music from an SMB/CIFS network share directly (pure Rust, no mount). Pulls
# in the `smb` crate; see crate::smb.
provider-smb = ["dep:smb", "dep:futures"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
md-5.workspace = true
musicata-core = { path = "../musicata-core" }
musicata-storage = { path = "../musicata-storage" }
notify = "6.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
smb = { version = "0.11.2", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tower.workspace = true
