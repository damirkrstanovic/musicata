<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16181d">
    <title>Musicata</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header id="mobile-bar" class="mobile-bar">
      <button id="menu-toggle" class="bar-icon" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
      <span class="mobile-brand">Musicata</span>
      <button id="mobile-settings" class="bar-icon" type="button" aria-label="Players &amp; settings">⚙</button>
    </header>
    <div id="scrim" class="scrim" hidden></div>

    <main class="shell">
      <aside class="library-panel">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div class="brand-text">
            <h1>Musicata</h1>
            <p id="summary">Scanning library...</p>
          </div>
        </div>

        <label class="search">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <line x1="20" y1="20" x2="15.5" y2="15.5"></line>
            </svg>
          </span>
          <input id="search" type="search" autocomplete="off" placeholder="Search">
        </label>

        <nav class="library-nav" aria-label="Views">
          <button class="nav-link is-active" type="button" data-view="library">Tracks</button>
          <button class="nav-link" type="button" data-view="favorites">Favorites</button>
          <button class="nav-link" type="button" data-view="recent">Recently played</button>
          <button class="nav-link" type="button" data-view="most">Most played</button>
        </nav>

        <section class="section">
          <h2>Browse</h2>
          <div class="browse-filters">
            <label>
              <span>Genre</span>
              <select id="browse-genre"></select>
            </label>
            <label>
              <span>Year</span>
              <select id="browse-year"></select>
            </label>
            <label>
              <span>Composer</span>
              <select id="browse-composer"></select>
            </label>
            <button id="browse-clear" class="ghost-button" type="button">Clear</button>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>Playlists</h2>
            <button id="new-playlist" class="ghost-button mini" type="button" title="New playlist">＋</button>
          </div>
          <div id="playlists" class="playlist-list"></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>Radio</h2>
            <button id="new-radio" class="ghost-button mini" type="button" title="Add station">＋</button>
          </div>
          <div id="radio" class="playlist-list"></div>
        </section>

        <section class="section">
          <h2>Albums</h2>
          <div id="albums" class="album-list"></div>
        </section>
      </aside>

      <section class="content">
        <header class="content-header">
          <div>
            <p class="eyebrow">Local disk provider</p>
            <h2 id="view-title">Tracks</h2>
          </div>
        </header>

        <div id="track-list" class="track-list"></div>
      </section>

      <aside class="right-rail">
        <div class="rail-header">
          <button id="np-collapse" class="np-chevron" type="button" aria-label="Collapse player">⌄</button>
          <div class="player-switch">
            <button id="player-switch-btn" class="player-switch-btn" type="button" aria-haspopup="true" aria-expanded="false">
              <span id="switch-signal" class="signal" aria-hidden="true"></span>
              <span id="switch-name" class="switch-name">This Browser</span>
              <span class="chev" aria-hidden="true">▾</span>
            </button>
            <div id="player-menu" class="player-menu" hidden role="menu">
              <div id="player-menu-list" class="player-menu-list"></div>
              <button id="player-menu-config" class="player-menu-config" type="button">⚙&nbsp; Configure players…</button>
            </div>
          </div>
        </div>

        <div class="rail-top">
          <div id="metadata-panel" class="metadata-panel">
            <header class="metadata-header">
              <div>
                <p class="eyebrow">Metadata</p>
                <h2 id="metadata-title">No track selected</h2>
              </div>
              <button id="metadata-close" class="ghost-button" type="button">Close</button>
            </header>
            <div id="metadata-body" class="metadata-body">
              <p class="empty">No track selected.</p>
            </div>
          </div>

          <section id="queue-drawer" class="queue-drawer" hidden aria-label="Play queue">
            <header class="queue-head">
              <h2>Up Next</h2>
              <div class="queue-head-actions">
                <button id="queue-clear" class="ghost-button" type="button">Clear</button>
                <button id="queue-close" class="ghost-button" type="button">Close</button>
              </div>
            </header>
            <div id="queue-list" class="queue-list"></div>
          </section>
        </div>

        <footer class="transport" data-status="stopped">
          <div class="transport-now">
            <div id="now-art" class="now-art"><span id="now-art-fallback" class="now-art-fallback">♪</span></div>
            <div class="now-text">
              <strong id="now-title">Nothing playing</strong>
              <span id="now-subtitle">Select a track to begin.</span>
            </div>
            <div class="mini-controls">
              <button id="mini-play" class="control play" type="button" aria-label="Play">▶</button>
              <button id="np-expand" class="np-chevron up" type="button" aria-label="Expand player">⌃</button>
            </div>
          </div>

          <div class="seek-row">
            <span id="elapsed" class="time">0:00</span>
            <input id="seek" class="seek" type="range" min="0" max="0" value="0" step="1" aria-label="Seek">
            <span id="duration" class="time">0:00</span>
          </div>

          <div class="transport-main">
            <div class="transport-buttons">
              <button id="shuffle" class="toggle" type="button" title="Shuffle" aria-pressed="false">⤨</button>
              <button id="prev" class="control" type="button" title="Previous" aria-label="Previous">⏮</button>
              <button id="play-pause" class="control play" type="button" title="Play" aria-label="Play">▶</button>
              <button id="next" class="control" type="button" title="Next" aria-label="Next">⏭</button>
              <button id="repeat" class="toggle" type="button" title="Repeat" data-mode="off">↻</button>
            </div>
          </div>

          <div class="transport-aux">
            <label class="volume" title="Volume">
              <span class="vol-icon" aria-hidden="true">▮</span>
              <input id="footer-volume" type="range" min="0" max="100" value="100" aria-label="Volume">
            </label>
            <button id="queue-toggle" class="queue-btn" type="button" title="Queue" aria-pressed="false">
              <span class="queue-glyph">≣</span><span id="queue-count" class="queue-count">0</span>
            </button>
          </div>

          <audio id="audio" preload="none" hidden></audio>
        </footer>
      </aside>
    </main>

    <div id="radio-directory" class="settings-overlay" hidden>
      <div class="settings-card">
        <header class="settings-head">
          <h2>Browse radio</h2>
          <button id="radio-dir-close" class="ghost-button" type="button">Done</button>
        </header>
        <div class="settings-body">
          <label class="search">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <line x1="20" y1="20" x2="15.5" y2="15.5"></line>
              </svg>
            </span>
            <input id="radio-search" type="search" autocomplete="off" placeholder="Search stations…">
          </label>
          <div id="radio-results" class="radio-results"></div>
          <button id="radio-add-url" class="ghost-button" type="button">Add by URL instead…</button>
        </div>
      </div>
    </div>

    <div id="settings" class="settings-overlay" hidden>
      <div class="settings-card">
        <header class="settings-head">
          <h2>Players &amp; Zones</h2>
          <button id="settings-close" class="ghost-button" type="button">Done</button>
        </header>
        <div class="settings-body">
          <section class="settings-section">
            <h3>Players</h3>
            <div id="players-list" class="players-list"></div>
            <form id="add-player" class="inline-form">
              <input id="player-address" type="text" inputmode="url" autocomplete="off"
                     placeholder="MPD host:port" required>
              <input id="player-name" type="text" autocomplete="off" placeholder="Name (optional)">
              <button class="ghost-button" type="submit">Add player</button>
            </form>
            <p id="add-player-status" class="add-player-status"></p>
          </section>
          <section class="settings-section">
            <h3>Zones</h3>
            <div id="zones-list" class="zones-list"></div>
            <form id="add-zone" class="inline-form">
              <input id="zone-name" type="text" autocomplete="off" placeholder="New zone" required>
              <button class="ghost-button" type="submit">Add zone</button>
            </form>
          </section>
        </div>
      </div>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
