# Minimal MPD configuration for use with Musicata.
#
# Musicata controls MPD over its TCP protocol and hands it Musicata stream URLs
# to play, so MPD does not need access to your music files — `music_directory`
# can point at an empty directory. Start MPD with:
#
#   mpd --no-daemon docs/mpd.example.conf
#
# then run the server pointed at it:
#
#   cargo run -p musicata-server -- --mpd 127.0.0.1:6600 --public-url http://127.0.0.1:3030
#
# Adjust the paths below (they default under /tmp so this works out of the box
# for a throwaway/test instance).

music_directory   "/tmp/musicata-mpd/music"
db_file           "/tmp/musicata-mpd/db"
state_file        "/tmp/musicata-mpd/state"
pid_file          "/tmp/musicata-mpd/pid"
log_file          "/tmp/musicata-mpd/log"

bind_to_address   "127.0.0.1"
port              "6600"

# A real soundcard output. For a headless/CI instance with no audio hardware,
# replace this block with the null output below.
audio_output {
    type "pulse"
    name "Local PulseAudio"
}

# Headless / test output: accepts playback and advances state without a soundcard.
